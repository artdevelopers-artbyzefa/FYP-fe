name: Frontend Build & Trigger Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: FYP-fe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FYP-fe/frontend/package-lock.json

      - name: Install dependencies
        working-directory: FYP-fe/frontend
        run: npm ci

      - name: Build
        working-directory: FYP-fe/frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: FYP-fe/frontend/dist/
          retention-days: 1

      - name: Trigger backend deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BE_DEPLOY_TOKEN }}
          repository: artdevelopers-artbyzefa/FYP-be
          event-type: frontend-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
