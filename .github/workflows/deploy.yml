name: Deploy FYP Portal to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 143.110.240.144
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            FE_REPO="/var/www/fyp-frontend-repo"
            BE_DIR="/var/www/fyp"

            # ================================================================
            # STEP 1: Pull FYP-fe (this repo — contains backend + frontend)
            # ================================================================
            echo "=== Pulling FYP-fe repo ==="
            if [ -d "$FE_REPO/.git" ]; then
              cd "$FE_REPO"; git stash --include-untracked 2>/dev/null || true; git pull origin main
            else
              rm -rf "$FE_REPO"
              git clone https://github.com/artdevelopers-artbyzefa/FYP-fe.git "$FE_REPO"
            fi
            echo "✓ FYP-fe pulled"

            # ================================================================
            # STEP 2: Deploy backend from FYP-fe/backend
            # ================================================================
            echo "=== Deploying backend ==="
            rm -rf "$BE_DIR"
            mkdir -p "$BE_DIR"
            cp -r "$FE_REPO/backend/"* "$BE_DIR/"

            # Create .env with correct production values (using printf to avoid heredoc indentation issues in YAML)
            printf 'PORT=5000\nNODE_ENV=production\nMONGODB_URI=mongodb+srv://ininsico_db_user:4dCuve4pmYqove4K@ininsico.lgmaryq.mongodb.net/fypportal?appName=fypportal\nJWT_SECRET=%s\nJWT_EXPIRES_IN=7d\nFRONTEND_URL=https://fyp.artdevelopers.site\nSENDER_EMAIL=internshipofficecuiatd@gmail.com\nSENDER_NAME=CUI-ATD\n' "$(openssl rand -hex 32)" > "$BE_DIR/.env"

            # Inject Brevo API key if GitHub secret exists
            if [ -n "${{ secrets.BREVO_API_KEY }}" ]; then
              printf 'BREVO_API_KEY=%s\n' "${{ secrets.BREVO_API_KEY }}" >> "$BE_DIR/.env"
            fi

            # Install backend dependencies
            cd "$BE_DIR"
            npm install 2>&1
            echo "✓ Backend deps installed"

            # ================================================================
            # STEP 3: Build and deploy frontend
            # ================================================================
            echo "=== Building frontend ==="
            cd "$FE_REPO/frontend"
            npm install 2>&1 | tail -3
            npm run build 2>&1
            echo "✓ Frontend built"

            rm -rf /var/www/fyp-frontend/dist
            mkdir -p /var/www/fyp-frontend/dist
            cp -r "$FE_REPO/frontend/dist/"* /var/www/fyp-frontend/dist/
            echo "✓ Frontend deployed"

            # ================================================================
            # STEP 4: Start/restart backend via PM2
            # ================================================================
            echo "=== Starting backend via PM2 ==="
            pm2 delete fyp-backend 2>/dev/null || true
            pm2 start "$BE_DIR/server.js" --name fyp-backend 2>&1
            pm2 save 2>/dev/null || true
            echo "✓ PM2 process fyp-backend started"

            echo "=== Deploy complete ==="
