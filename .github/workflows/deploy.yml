name: Deploy FYP Portal to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 143.110.240.144
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            FE_REPO="/var/www/fyp-frontend-repo"
            BE_DIR="/var/www/fyp"

            echo "=== Restoring original FYP-be backend ==="
            BACKEND_RESTORED=false
            if [ -d "$BE_DIR/.git" ]; then
              cd "$BE_DIR"
              git stash --include-untracked 2>/dev/null || true
              git pull origin main && BACKEND_RESTORED=true
              echo "✓ Backend pulled from existing FYP-be repo"
            else
              rm -rf "$BE_DIR"
              git clone https://github.com/artdevelopers-artbyzefa/FYP-be.git "$BE_DIR" 2>&1 && BACKEND_RESTORED=true || echo "⚠ FYP-be clone failed"
            fi

            if [ "$BACKEND_RESTORED" = false ]; then
              echo "=== FYP-be not available — using FYP-fe/backend as fallback ==="
              rm -rf "$BE_DIR"
              mkdir -p "$BE_DIR"
              cp -r "$FE_REPO/backend/"* "$BE_DIR/"
              # Set correct MongoDB URI for Atlas
              sed -i "s|MONGODB_URI=.*|MONGODB_URI=mongodb+srv://ininsico_db_user:4dCuve4pmYqove4K@ininsico.lgmaryq.mongodb.net/fypportal?appName=fypportal|" "$BE_DIR/.env.example"
              echo "✓ Fallback backend deployed from FYP-fe/backend"
            fi
            if [ -f "$BE_DIR/package.json" ]; then
              cd "$BE_DIR"
              npm install --production --silent 2>&1 | tail -1
              echo "✓ Backend deps installed"
            else
              echo "⚠ Skipping backend npm install — no package.json found"
            fi

            echo "=== Injecting Brevo email route into backend ==="
            if [ -d "$BE_DIR" ]; then
              if [ -n "${{ secrets.BREVO_API_KEY }}" ]; then
                if ! grep -q "BREVO_API_KEY" "$BE_DIR/.env" 2>/dev/null; then
                  echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> "$BE_DIR/.env"
                  echo "SENDER_EMAIL=internshipofficecuiatd@gmail.com" >> "$BE_DIR/.env"
                  echo "SENDER_NAME=CUI-ATD" >> "$BE_DIR/.env"
                  echo "✓ Brevo credentials added to backend .env"
                fi
              fi
            fi

            echo "=== Pulling FYP-fe (frontend) ==="
            if [ -d "$FE_REPO/.git" ]; then
              cd "$FE_REPO"
              git stash --include-untracked 2>/dev/null || true
              git pull origin main
            else
              rm -rf "$FE_REPO"
              git clone https://github.com/artdevelopers-artbyzefa/FYP-fe.git "$FE_REPO"
            fi

            echo "=== Installing email route into backend ==="
            mkdir -p "$BE_DIR/routes"
            cp "$FE_REPO/server/send-email-route.js" "$BE_DIR/routes/send-email-route.js"
            node "$FE_REPO/server/inject-route.js" "$BE_DIR"

            echo "=== Installing frontend deps & building ==="
            cd "$FE_REPO/frontend"
            npm install --silent 2>&1 | tail -1
            npm run build

            echo "=== Copying frontend build to production path ==="
            rm -rf /var/www/fyp-frontend/dist
            mkdir -p /var/www/fyp-frontend/dist
            cp -r "$FE_REPO/frontend/dist/"* /var/www/fyp-frontend/dist/

            echo "=== Restarting PM2 ==="
            if pm2 show fyp-backend 2>/dev/null; then
              pm2 restart fyp-backend 2>&1 | tail -5
              echo "✓ PM2 process fyp-backend restarted"
            else
              echo "⚠ PM2 process fyp-backend not found — you may need to start it manually:"
              echo "  cd $BE_DIR && pm2 start server.js --name fyp-backend"
            fi

            echo "=== Deploy complete ==="
