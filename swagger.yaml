openapi: 3.0.3
info:
  title: FYP Portal API - COMSATS University Islamabad, Abbottabad Campus
  description: >
    Backend API for the Final Year Project (FYP) Portal. Supports student enrollment,
    supervision management, proposal workflows, evaluations, committee oversight,
    grievance handling, RBAC administration, and industry supervisor integration.
  version: 1.0.0
  contact:
    email: internshipofficecuiatd@gmail.com

servers:
  - url: /api
    description: Proxied API base (via Vite dev server or Nginx)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /auth/login

  schemas:
    # ------------------------------------------------------------------
    # Common / Shared Schemas
    # ------------------------------------------------------------------
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
        error:
          type: string

    # ------------------------------------------------------------------
    # Auth Schemas
    # ------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: student@cuiatd.edu.pk
        password:
          type: string
          format: password
          example: "123"
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Ahmed Farooq
        email:
          type: string
          format: email
          example: student@cuiatd.edu.pk
        password:
          type: string
          format: password
          example: "123"
        role:
          type: string
          enum: [student, faculty, hod, office-assistant, office-incharge, admin, industry]
          default: student

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string

    # ------------------------------------------------------------------
    # User Schemas
    # ------------------------------------------------------------------
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
          enum: [Active, Locked, Deactivated]

    UserProfile:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        regNo:
          type: string
        semester:
          type: string
        section:
          type: string
        cgpa:
          type: string
        fatherName:
          type: string
        profileCompleted:
          type: boolean

    # ------------------------------------------------------------------
    # Student Schemas
    # ------------------------------------------------------------------
    StudentPartner:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        regNo:
          type: string
        cgpa:
          type: string
        semester:
          type: string
        section:
          type: string

    PartnerRequest:
      type: object
      properties:
        id:
          type: string
        fromId:
          type: string
        name:
          type: string
        regNo:
          type: string
        cgpa:
          type: string
        program:
          type: string

    Supervisor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        designation:
          type: string
        tags:
          type: array
          items:
            type: string
        avatar:
          type: string

    IdeaSubmission:
      type: object
      properties:
        title:
          type: string
        desc:
          type: string
        tags:
          type: array
          items:
            type: string
        supervisor:
          type: string

    ApprovedIdea:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        desc:
          type: string
        tags:
          type: array
          items:
            type: string
        supervisor:
          type: string

    Task:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        status:
          type: string
          enum: [todo, in-progress, review, done]
        categories:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [high, medium, low]
        date:
          type: string
          format: date
        overdue:
          type: boolean
        assignee:
          type: string
        progress:
          type: number

    # ------------------------------------------------------------------
    # Faculty Schemas
    # ------------------------------------------------------------------
    FacultyDashboard:
      type: object
      properties:
        supervisedGroups:
          type: number
        supervisedCap:
          type: number
        pendingProposals:
          type: number
        weeklyLogs:
          type: string
        committeeHead:
          type: string

    FacultyProfile:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string

    AvailabilitySlot:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
        slots:
          type: array
          items:
            type: string

    Proposal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        students:
          type: array
          items:
            type: string
        status:
          type: string

    SupervisionGroup:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        members:
          type: array
          items:
            type: string
        progress:
          type: string
        logStatus:
          type: string

    Message:
      type: object
      properties:
        sender:
          type: string
        text:
          type: string
        time:
          type: string

    Evaluation:
      type: object
      properties:
        id:
          type: string
        student:
          type: string
        committee:
          type: string
        type:
          type: string
        status:
          type: string

    HeadDuty:
      type: object
      properties:
        committeeId:
          type: string
        activeMembers:
          type: number
        pendingConsolidations:
          type: number
        nextMeeting:
          type: string

    MessagingGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        members:
          type: array
          items:
            type: string
        lastMessage:
          type: string

    ScorecardPayload:
      type: object
      required: [groupId, scores]
      properties:
        groupId:
          type: string
        scores:
          type: array
          items:
            type: object
            properties:
              criterion:
                type: string
              weight:
                type: number
              score:
                type: number
        remarks:
          type: string

    ConsensusGroup:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        scores:
          type: array
          items:
            type: object
        status:
          type: string

    # ------------------------------------------------------------------
    # HOD Schemas
    # ------------------------------------------------------------------
    HodDashboard:
      type: object
      properties:
        totalGroups:
          type: number
        escalatedGrievances:
          type: number
        activeFaculty:
          type: number
        cloAttainmentAvg:
          type: string

    Escalation:
      type: object
      properties:
        id:
          type: string
        student:
          type: string
        regNo:
          type: string
        category:
          type: string
        date:
          type: string
        details:
          type: string
        inchargeNote:
          type: string
        escalatedBy:
          type: string

    FacultyWorkload:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        designation:
          type: string
        slots:
          type: string
        research:
          type: array
          items:
            type: string
        compliance:
          type: string

    GovernanceData:
      type: object
      properties:
        committees:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              head:
                type: string
              members:
                type: array
                items:
                  type: string
              status:
                type: string
        rubrics:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
              validation:
                type: string

    AnalyticsData:
      type: object
      properties:
        passRate:
          type: string
        repeatRate:
          type: string
        grades:
          type: array
          items:
            type: object
            properties:
              grade:
                type: string
              percentage:
                type: number
        clos:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              average:
                type: number

    # ------------------------------------------------------------------
    # Office Assistant Schemas
    # ------------------------------------------------------------------
    OfficeDashboard:
      type: object
      properties:
        totalUsers:
          type: number
        activeUsers:
          type: string
        fypStudents:
          type: number
        studentsStatus:
          type: string
        activeProjects:
          type: number
        projectsStatus:
          type: string
        committees:
          type: number
        committeesStatus:
          type: string

    OfficeUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        roleDetail:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Active, Locked, Deactivated]

    OfficeStudent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        project:
          type: string
        progress:
          type: string
        supervisor:
          type: string

    CreateStudentPayload:
      type: object
      required: [name, regNo, email]
      properties:
        name:
          type: string
        regNo:
          type: string
        email:
          type: string
        semester:
          type: string
        fatherName:
          type: string
        whatsappNumber:
          type: string
        section:
          type: string
        cgpa:
          type: string

    OfficeFaculty:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        designation:
          type: string
        proposed:
          type: number
        inProgress:
          type: number
        completed:
          type: number
        research:
          type: array
          items:
            type: string
        schedule:
          type: array
          items:
            type: string

    OfficeProject:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        leader:
          type: string
        supervisor:
          type: string
        status:
          type: string
        stack:
          type: string
        desc:
          type: string

    ContentItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        currentVersion:
          type: string
        date:
          type: string
        size:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              date:
                type: string

    ExternalEvaluator:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        window:
          type: string
        project:
          type: string
        status:
          type: string

    ResultEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        project:
          type: string
        m10:
          type: string
        m30:
          type: string
        m60:
          type: string
        m100:
          type: string
        final:
          type: string

    # ------------------------------------------------------------------
    # Office In-charge Schemas
    # ------------------------------------------------------------------
    InchargeDashboard:
      type: object
      properties:
        activeRubrics:
          type: number
        pendingSupervisionReqs:
          type: number
        openGrievances:
          type: number
        slaBreaches:
          type: number
        activeSession:
          type: string

    Rubric:
      type: object
      properties:
        version:
          type: string
        date:
          type: string
        status:
          type: string

    Session:
      type: object
      properties:
        sessionName:
          type: string
        duration:
          type: string
        repeats:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              regNo:
                type: string
              status:
                type: string

    SupervisionRequest:
      type: object
      properties:
        faculty:
          type: string
        designation:
          type: string
        load:
          type: number
        requested:
          type: number
        justification:
          type: string

    CommitteeOversight:
      type: object
      properties:
        boards:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              head:
                type: string
              members:
                type: array
                items:
                  type: string
              schedule:
                type: string
        requests:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string

    Grievance:
      type: object
      properties:
        id:
          type: string
        student:
          type: string
        category:
          type: string
        date:
          type: string
        status:
          type: string
        sla:
          type: string
        desc:
          type: string

    FacultyReport:
      type: object
      properties:
        name:
          type: string
        dept:
          type: string
        groups:
          type: number
        workload:
          type: string
        evalScore:
          type: string

    StudentReport:
      type: object
      properties:
        name:
          type: string
        regNo:
          type: string
        progress:
          type: string
        group:
          type: string
        supervisor:
          type: string
        score:
          type: string

    AuditLog:
      type: object
      properties:
        time:
          type: string
        user:
          type: string
        type:
          type: string
        entity:
          type: string
        ip:
          type: string

    Phase:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        active:
          type: boolean
        order:
          type: number

    # ------------------------------------------------------------------
    # Admin Schemas
    # ------------------------------------------------------------------
    AdminStats:
      type: object
      properties:
        totalUsers:
          type: number
        activeRoles:
          type: number
        auditLogEntries:
          type: string
        systemHealth:
          type: string

    AdminUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string

    CreateUserPayload:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string

    RbacEntry:
      type: object
      properties:
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        users:
          type: number
        status:
          type: string

    SystemHealth:
      type: object
      properties:
        cpuLoad:
          type: string
        ramUsed:
          type: string
        ramTotal:
          type: string
        dbUsed:
          type: string
        dbTotal:
          type: string
        uptime:
          type: string

    Notification:
      type: object
      properties:
        id:
          type: string
        icon:
          type: string
        title:
          type: string
        body:
          type: string
        time:
          type: string
        read:
          type: boolean
        color:
          type: string

    # ------------------------------------------------------------------
    # Industry Schemas
    # ------------------------------------------------------------------
    AssignedProject:
      type: object
      properties:
        groupId:
          type: string
        title:
          type: string
        members:
          type: array
          items:
            type: string
        internalSupervisor:
          type: string
        thesisFile:
          type: string
        evaluationStatus:
          type: string
          enum: [pending, submitted]
        submittedAt:
          type: string

    # ------------------------------------------------------------------
    # Email Schemas
    # ------------------------------------------------------------------
    SendWelcomeEmailPayload:
      type: object
      required: [name, email, regNo]
      properties:
        name:
          type: string
          example: Ahmed Farooq
        email:
          type: string
          format: email
          example: student@cuiatd.edu.pk
        regNo:
          type: string
          example: CIIT/FA21-BCS-001/ATD
        subject:
          type: string
          example: FYP Portal Account Created - CUI-ATD

paths:
  # ==================================================================
  # AUTH
  # ==================================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and return JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate current session
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh expired JWT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  # ==================================================================
  # USER PROFILE
  # ==================================================================
  /user/profile:
    get:
      tags: [User]
      summary: Get current user profile
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    post:
      tags: [User]
      summary: Update current user profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  # ==================================================================
  # STUDENT
  # ==================================================================
  /student/profile:
    get:
      tags: [Student]
      summary: Get student profile
      responses:
        '200':
          description: Student profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /student/profile/update:
    post:
      tags: [Student]
      summary: Update student profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /student/partners/search:
    get:
      tags: [Student]
      summary: Search for potential project partners
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (matches regNo and email)
      responses:
        '200':
          description: Matching students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentPartner'

  /student/partners/request:
    post:
      tags: [Student]
      summary: Send partner request to a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId]
              properties:
                studentId:
                  type: string
      responses:
        '200':
          description: Request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /student/partners/incoming:
    get:
      tags: [Student]
      summary: Get incoming partner requests
      responses:
        '200':
          description: Incoming requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerRequest'

  /student/partners/respond:
    post:
      tags: [Student]
      summary: Accept or reject a partner request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, status]
              properties:
                requestId:
                  type: string
                status:
                  type: string
                  enum: [accepted, rejected]
      responses:
        '200':
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /student/supervisors:
    get:
      tags: [Student]
      summary: List available supervisors
      responses:
        '200':
          description: Supervisor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supervisor'

  /student/supervisors/request:
    post:
      tags: [Student]
      summary: Request a supervisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supervisorId]
              properties:
                supervisorId:
                  type: string
      responses:
        '200':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /student/ideas/submit:
    post:
      tags: [Student]
      summary: Submit a project idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaSubmission'
      responses:
        '200':
          description: Idea submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /student/ideas/approved:
    get:
      tags: [Student]
      summary: Get approved project ideas
      responses:
        '200':
          description: Approved ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovedIdea'

  /student/ideas/select:
    post:
      tags: [Student]
      summary: Select an approved idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ideaId]
              properties:
                ideaId:
                  type: string
      responses:
        '200':
          description: Idea selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /student/tasks:
    get:
      tags: [Student]
      summary: Get student tasks
      responses:
        '200':
          description: Task list (flat array or grouped object)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  - type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/Task'
    post:
      tags: [Student]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created

  /student/tasks/{id}:
    put:
      tags: [Student]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
